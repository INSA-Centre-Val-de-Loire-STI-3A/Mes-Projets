name: build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      # compile chaque source C non vide ; les squelettes des TD à venir sont ignorés
      - name: Compiler (-Wall -Wextra -Werror, analyseur statique de gcc)
        env:
          IRC_INCLUDE: programmation-reseaux/tp/tp01-irc-note/include   # en-têtes du TP IRC
        run: |
          status=0
          for f in $(git ls-files '*.c'); do
            [ -s "$f" ] || continue
            echo "::group::$f"
            gcc -Wall -Wextra -Werror -fanalyzer -std=gnu11 -I"$IRC_INCLUDE" -c -o /dev/null "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Analyse statique (cppcheck)
        run: |
          for f in $(git ls-files '*.c'); do if [ -s "$f" ]; then echo "$f"; fi; done > sources.txt
          cppcheck --enable=warning,portability --error-exitcode=1 --inline-suppr \
                   -I programmation-reseaux/tp/tp01-irc-note/include --file-list=sources.txt

      # exécute les programmes qui n'ont pas besoin du réseau, sous AddressSanitizer
      - name: Exécuter sous AddressSanitizer
        run: |
          cd programmation-systeme/td/td01-appels-systeme/src
          gcc -fsanitize=address,undefined -g -o /tmp/ex01 ex01_hello.c
          test "$(/tmp/ex01)" = "hello"
          for ex in ex02_03_erreur ex04_my_perror; do
            gcc -fsanitize=address,undefined -g -o /tmp/$ex $ex.c
            # ces exercices provoquent volontairement EBADF : code de sortie 1 attendu
            /tmp/$ex 2>&1 | grep -q "Bad file descriptor"
          done

  reseau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler les TD et le TP de programmation réseau
        run: make -C programmation-reseaux
      # TD3 : le fichier téléchargé doit être identique à l'original
      - name: Tester le téléchargement (TD3)
        run: |
          cd programmation-reseaux/td/td03-tcp-multiclient
          ./scripts/gen_test_file.sh /tmp/test.txt
          (cat /tmp/test.txt | nc -l 8000 -N &) ; sleep 0.5
          ./bin/download_client 127.0.0.1 8000 /tmp/download.txt
          cmp /tmp/test.txt /tmp/download.txt
      # TP IRC : echo, serveur et client (sous AddressSanitizer)
      - name: Tester le TP IRC
        env:
          ASAN_OPTIONS: verify_asan_link_order=0
        run: |
          cd programmation-reseaux/tp/tp01-irc-note
          make clean
          make test CFLAGS="-Wall -Wextra -g -Iinclude -fsanitize=address,undefined"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # chaque exercice se vérifie par ses assert : le script doit se terminer sans erreur
      - name: Exécuter les TD Python
        run: |
          status=0
          for f in $(git ls-files 'python/*.py'); do
            echo "::group::$f"
            python3 -W error "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  assembleur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer nasm
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Assembler les TD
        run: make -C assembleur
      # les programmes qui se terminent par exit doivent renvoyer 0
      - name: Exécuter
        run: |
          cd assembleur/td/td01-x86-32bits
          test "$(./bin/hello32)" = "Hello insa-cvl!"
          for ex in ex2_1_drapeaux ex2_3_operations ex2_4_if_else; do ./bin/$ex; done
          cd ../td02-fonctions-pile
          test "$(./bin/ex2_aff_bin)" = "Valeur en binaire : 00000000000000000000011111101010"
