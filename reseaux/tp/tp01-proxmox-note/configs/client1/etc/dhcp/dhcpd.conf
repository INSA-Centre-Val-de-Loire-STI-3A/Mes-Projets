# client1 — /etc/dhcp/dhcpd.conf
authoritative;
default-lease-time 600;
max-lease-time 7200;

subnet 10.10.3.0 netmask 255.255.255.0 {
    range 10.10.3.20 10.10.3.50;
    option routers 10.10.3.254;
    option subnet-mask 255.255.255.0;

    # Q3.1 : DNS public
    option domain-name-servers 8.8.8.8;
    # Q4.2 : remplacer par le DNS de client2
    # option domain-name-servers 10.10.2.2;
    # option domain-name "tienou-tp.insa-cvl.fr";
}
