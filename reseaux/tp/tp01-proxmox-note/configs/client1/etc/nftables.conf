#!/usr/sbin/nft -f
# client1 — /etc/nftables.conf (chargé au boot par nftables.service)

flush ruleset

define WAN      = eth0
define CLIENT2  = 10.10.2.2
define CLIENT3  = 10.10.3.2
# Q6.7 : adresse secondaire de client1 sur vmbr1
define WAN_ALT  = 10.0.0.200

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Q5.3 : NAT one-to-one vers les serveurs internes
        iifname $WAN udp dport 53 dnat to $CLIENT2
        iifname $WAN tcp dport 53 dnat to $CLIENT2
        iifname $WAN tcp dport 80 dnat to $CLIENT3

        # Q6.7 : SSH sur l'adresse secondaire -> client3
        ip daddr $WAN_ALT tcp dport 22 dnat to $CLIENT3
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Q2.2 : masquerade des paquets sortant vers OPNsense
        oifname $WAN masquerade
    }
}
